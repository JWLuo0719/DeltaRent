spring:
  datasource:
    url: jdbc:h2:mem:deltatrade;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.jwluo0719.deltatrade: debug
